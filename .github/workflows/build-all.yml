name: Build All

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: build-all-${{ github.event_name }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-all:
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image_name:
          - "age"
          - "antlr"
          - "latex"
    uses: ./.github/workflows/build-one.yml
    with:
      image_name: ${{ matrix.image_name }}
      push: ${{ github.event_name == 'push' }}

  finish:
    runs-on: ubuntu-26.04
    if: ${{ github.event_name == 'pull_request' }}
    needs: build-all
    steps:
      - run: true
