name: Build

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Build base
      run: docker build . --file base.Dockerfile --tag base
    - name: Build age
      run: docker build . --file age.Dockerfile --tag age --pull=false
    - name: Build latex
      run: docker build . --file latex.Dockerfile --tag latex --pull=false
