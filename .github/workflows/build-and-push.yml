name: Build and Push

on:
  workflow_dispatch:
  schedule:
    - cron: '39 12 * * *'

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        version: v0.37.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      id: build-and-push
      with:
        context: .
        file: base.Dockerfile
        tags: ${{ env.REGISTRY }}/${{ github.repository }}/base:latest
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=https://github.com/dentist8204/images/base.Dockerfile
          org.opencontainers.image.licenses=MIT
          org.opencontainers.image.description=Arch image with an unprivileged user
  derivatives:
    runs-on: ubuntu-latest
    needs: base
    strategy:
      matrix:
        name:
          - age
          - latex
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        version: v0.37.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      id: build-and-push
      with:
        context: .
        file: ${{ matrix.name }}.Dockerfile
        tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}:latest
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=https://github.com/dentist8204/images/${{ matrix.name }}.Dockerfile
          org.opencontainers.image.licenses=MIT
  antlr:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        version: v0.37.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      id: build-and-push
      with:
        context: .
        file: antlr.Dockerfile
        tags: ${{ env.REGISTRY }}/${{ github.repository }}/antlr:latest
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=https://github.com/dentist8204/images/antlr.Dockerfile
          org.opencontainers.image.licenses=MIT
    
