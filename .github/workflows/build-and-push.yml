name: Build and Push

on:
  workflow_dispatch:
    inputs:
      push:
        type: boolean
        default: false
      image_name:
        required: true
        type: choice
        options:
          - "age"
          - "antlr"
          - "latex"

  workflow_call:
    inputs:
      push:
        type: boolean
        default: false
      image_name:
        required: true
        type: string

concurrency:
  group: build-and-push-${{ github.event_name }}-${{ github.ref || github.run_id }}-${{ inputs.image_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ inputs.push }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-push
        with:
          file: contexts/${{ inputs.image_name }}/Dockerfile
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.image_name }}:latest
          push: ${{ inputs.push }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/dockerfiles/${{ inputs.image_name }}
            org.opencontainers.image.licenses=MIT
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ inputs.push }}
        with:
          cosign-release: 'v3.0.6'
      - name: Sign the Image
        if: ${{ inputs.push }}
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.image_name }}:latest@${{ steps.build-push.outputs.digest }}
