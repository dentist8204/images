name: Build One

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      push:
        type: boolean
        default: false

concurrency:
  group: build-one-${{ github.event_name }}-${{ github.ref || github.run_id }}-${{ inputs.image_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  USERNAME: temp-user
  UID: 1008

jobs:
  check-paths:
    runs-on: ubuntu-26.04
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            build:
              - '.github/workflows/build-one.yml'
              - 'config/seccomp/**'
              - 'contexts/${{ inputs.image_name }}/**'
              - 'environments/${{ inputs.image_name }}/**'
              - 'scripts/seccomp/**'

  build:
    runs-on: ubuntu-26.04
    needs: check-paths
    if: ${{ needs.check-paths.outputs.build == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ inputs.push }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-push
        with:
          context: contexts/${{ inputs.image_name }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.image_name }}:latest
          push: ${{ inputs.push }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/dockerfiles/${{ inputs.image_name }}
            org.opencontainers.image.licenses=MIT
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ inputs.push }}
        with:
          cosign-release: 'v3.0.6'
      - name: Sign the Image
        if: ${{ inputs.push }}
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.image_name }}@${{ steps.build-push.outputs.digest }}
      - name: Install Packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends auditd bpftrace crun podman python3
      - name: Setup Temporary User
        run: |
          set -euo pipefail
          sudo groupadd --gid ${{ env.UID }} ${{ env.USERNAME }}
          sudo useradd --uid ${{ env.UID }} --gid ${{ env.UID }} --create-home --shell /bin/bash ${{ env.USERNAME }}
          echo "${{ env.USERNAME }}:157257050:65536" | sudo tee /etc/subuid
          echo "${{ env.USERNAME }}:157257050:65536" | sudo tee /etc/subgid
          sudo cp -r environments /home/${{ env.USERNAME }}
          sudo mkdir -p /home/${{ env.USERNAME }}/config
          sudo cp -r config/seccomp /home/${{ env.USERNAME }}/config
          sudo chown -R ${{ env.USERNAME }}:${{ env.USERNAME }} /home/${{ env.USERNAME }}
          sudo loginctl enable-linger ${{ env.USERNAME }}
      - name: Run Scripts
        run: |
          set -euo pipefail
          python3 scripts/seccomp/run-tests.py ${{ inputs.image_name }} ${{ env.REGISTRY }}/${{ github.repository }} ${{ env.USERNAME }} /run/user/${{ env.UID }} ${{ steps.build-push.outputs.digest }}
          python3 scripts/seccomp/format-profile.py
      - name: Upload and Sign the Seccomp Profile
        if: ${{ inputs.push }}
        run: cosign attest --predicate seccomp-profile.json --type https://seccomp-profile.local --yes ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.image_name }}@${{ steps.build-push.outputs.digest }}
