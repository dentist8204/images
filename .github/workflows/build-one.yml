name: Build One

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      push:
        type: boolean
        default: false

concurrency:
  group: build-one-${{ github.event_name }}-${{ github.ref || github.run_id }}-${{ inputs.image_name }}
  cancel-in-progress: true

jobs:
  check-paths:
    runs-on: ubuntu-26.04
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            build:
              - '.github/workflows/build-one.yml'
              - 'config/seccomp/**'
              - '!config/seccomp/never-allow.json'
              - 'contexts/${{ inputs.image_name }}/**'
              - 'scripts/seccomp/**'
              - 'tests/environments/${{ inputs.image_name }}/**'
              - 'tests/scenarios/${{ inputs.image_name }}.json'

  build:
    runs-on: ubuntu-26.04
    needs: check-paths
    if: ${{ needs.check-paths.outputs.build == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_URL: ${{ vars.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.image_name }}
      USERNAME: temp-user
      UID: 1008
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: ${{ inputs.push }}
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-push
        with:
          context: contexts/${{ inputs.image_name }}
          tags: ${{ env.IMAGE_URL }}:staged
          push: ${{ inputs.push }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/dockerfiles/${{ inputs.image_name }}
            org.opencontainers.image.licenses=MIT
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: ${{ inputs.push }}
        with:
          cosign-release: 'v3.0.6'
      - name: Sign the Image
        if: ${{ inputs.push }}
        run: cosign sign --yes "$IMAGE_URL@${{ steps.build-push.outputs.digest }}"
      - name: Install Packages
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends auditd bpftrace crun linux-headers-$(uname -r) podman python3
      - name: Setup Temporary User
        run: |
          set -euxo pipefail

          sudo groupadd --gid "$UID" "$USERNAME"
          sudo useradd --uid "$UID" --gid "$UID" --create-home --shell /bin/bash "$USERNAME"

          echo "$USERNAME:157257050:65536" | sudo tee /etc/subuid
          echo "$USERNAME:157257050:65536" | sudo tee /etc/subgid

          sudo cp -r tests "/home/$USERNAME"
          sudo mkdir -p "/home/$USERNAME/config"
          sudo cp -r config/seccomp "/home/$USERNAME/config"
          sudo chown -R "$USERNAME:$USERNAME" "/home/$USERNAME"

          sudo loginctl enable-linger "$USERNAME"
      - name: Trace Containers
        run: python3 scripts/seccomp/run-tests.py ${{ inputs.image_name }} ${{ vars.REGISTRY }}/${{ github.repository_owner }} "$USERNAME" "/run/user/$UID" ${{ steps.build-push.outputs.digest }}
      - name: Create Seccomp Profile
        run: python3 scripts/seccomp/format-profile.py
      - name: Upload and Sign the Seccomp Profile
        if: ${{ inputs.push }}
        run: cosign attest --predicate seccomp-profile.json --type https://seccomp-profile.local --yes "$IMAGE_URL@${{ steps.build-push.outputs.digest }}"
      - name: Install crane
        if: ${{ inputs.push }}
        run: go install github.com/google/go-containerregistry/cmd/crane@8a72a424fdecb4caa14f2d525e5d2503331442b5 # v0.22.1
      - name: Add latest Tag
        if: ${{ inputs.push }}
        run: $(go env GOPATH)/bin/crane tag "$IMAGE_URL@${{ steps.build-push.outputs.digest }}" latest
