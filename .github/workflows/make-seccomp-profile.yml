name: Make Seccomp Profile

on:
  workflow_dispatch:
    inputs:
      image_name:
        required: true
        type: choice
        options: ["age", "antlr", "base", "latex"]
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        
env:
  REGISTRY: ghcr.io

jobs:
  make-seccomp-profile:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends auditd bpftrace crun podman python3
        python3 scripts/run-seccomp-tests.py ${{ inputs.image_name }} ${{ env.REGISTRY }}/${{ github.repository }}
        python3 scripts/format-seccomp-profile.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: seccomp-${{ inputs.image_name }}
        path: |
          syscalls.txt
          seccomp-profile.json
      
      
