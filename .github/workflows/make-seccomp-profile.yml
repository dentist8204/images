name: Make Seccomp Profile

on:
  workflow_dispatch:
    inputs:
      image_name:
        required: true
        type: choice
        options: ["age", "antlr", "base", "latex"]
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

jobs:
  make-seccomp-profile:
    runs-on: ubuntu-latest
    steps:
    - run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends auditd bpftrace
    - run: |
        sudo bpftrace -e '
            tracepoint:syscalls:sys_enter_execve 
            /str(args->filename) == "runc" ||
             str(args->filename) == "/usr/bin/runc" || 
             str(args->filename) == "/usr/local/bin/runc"/ 
            { 
              @runtime_tree[tid] = 1; 
            } 

            tracepoint:sched:sched_process_fork 
            /@runtime_tree[tid]/ 
            { 
              @runtime_tree[args->child_pid] = 1; 
            } 
            
            tracepoint:syscalls:sys_enter_seccomp
            /@runtime_tree[tid]/ 
            { 
              @pending[tid] = 1; 
            } 

            tracepoint:syscalls:sys_enter_execve
            /@pending[tid]/
            {
              @exec_attempt[tid] = 1;
              
              delete(@pending[tid]);
              delete(@runtime_tree[tid]);
            }
            
            tracepoint:syscalls:sys_exit_execve
            /@exec_attempt[tid]/
            {
              if (args->ret == 0) {
                @active_tree[tid] = 1;
                
                delete(@exec_attempt[tid]);
              }
            }

            tracepoint:sched:sched_process_fork 
            /@active_tree[tid]/ 
            { 
              @active_tree[args->child_pid] = 1; 
            } 

            tracepoint:raw_syscalls:sys_enter 
            /@active_tree[tid]/ 
            { 
              @current_id[tid] = args->id + 1; 
            } 

            tracepoint:raw_syscalls:sys_exit 
            /@current_id[tid]/ 
            { 
              if (args->ret > -1) { 
                @[@current_id[tid] - 1] = 1; 
              } 
              
              delete(@current_id[tid]);
            }

            tracepoint:sched:sched_process_exit
            {
              delete(@runtime_tree[tid]);
              delete(@active_tree[tid]);
              delete(@pending[tid]);
              delete(@exec_attempt[tid]);
              delete(@current_id[tid]);
            }
          ' -o syscalls.txt &
        BPF_PID=$!
        sleep 5
        CONTAINER_ID=$(docker create ghcr.io/${{ github.repository }}/${{ inputs.image_name }}:latest uname -a)
        docker start $CONTAINER_ID
        timeout 20s docker wait $CONTAINER_ID
        sudo kill $BPF_PID
    - run: |
        echo '{\n  "defaultAction": "SCMP_ACT_ERRNO",\n  "defaultErrno":"ENOSYS",\n  "architectures": [\n    "SCMP_ARCH_X86_64"\n  ],\n  "syscalls": [\n    {\n      "action": "SCMP_ACT_ALLOW",\n      "names": [' > seccomp-profile.json
        sed -nE 's/.*@\[([0-9]+)\].*/\1/p' syscalls.txt | xargs -I {} sh -c "ausyscall {}" | sed 's/^/"/;s/$/",/' | sed 's/(.*)/        (\1)/'>> seccomp-profile.json
        echo '        "execve"\n      ]\n    }\n  ]\n}' >> seccomp-profile.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: seccomp-data-${{ inputs.image_name }}
        path: |
          seccomp-profile.json
          syscalls.txt
      
      
