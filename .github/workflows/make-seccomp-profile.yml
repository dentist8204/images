name: Make Seccomp Profile

on:
  workflow_dispatch:
    inputs:
      image_name:
        required: true
        type: choice
        options: ["age", "antlr", "base", "latex"]
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

jobs:
  make-seccomp-profile:
    runs-on: ubuntu-latest
    steps:
    - run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends auditd bpftrace
    - run: |
        sudo bpftrace -e '
            tracepoint:syscalls:sys_enter_prctl 
            { 
              printf("%d called %d\n", pid, args->option); 
              @options[args->option] = count();
              @active[pid] = 1;
            } 

            tracepoint:sched:sched_process_fork 
            /@active[pid]/ 
            { 
              @active[args->child_pid] = 1; 
            } 

            tracepoint:raw_syscalls:sys_enter 
            /@active[pid]/ 
            { 
              @current_id[pid] = args->id; 
            } 

            tracepoint:raw_syscalls:sys_exit 
            /@active[pid]/ 
            { 
              if (args->ret != -1 && args->ret != -38) { 
                @[@current_id[pid]] = 1; 
              } 
              delete(@current_id[pid]); 
            }
          ' -o syscalls.txt &
        BPF_PID=$!
        sleep 5
        CONTAINER_ID=$(docker create ghcr.io/${{ github.repository }}/${{ inputs.image_name }}:latest uname -a)
        docker start $CONTAINER_ID
        timeout 5s docker wait $CONTAINER_ID
        sudo kill $BPF_PID
    - run: |
        echo '{"defaultAction":"SCMP_ACT_ERRNO","defaultErrno":"ENOSYS","architectures":["SCMP_ARCH_X86_64"],"syscalls":[{"action":"SCMP_ACT_ALLOW","names":[' > seccomp-profile-${{ inputs.image_name }}.json
        sed -nE 's/.*\[([0-9]+)\].*/\1/p' syscalls.txt | xargs -I {} sh -c "ausyscall {}" | sed 's/^/"/;s/$/",/' | sed '$ s/,$//' >> seccomp-profile-${{ inputs.image_name }}.json
        echo ']}]}' >> seccomp-profile-${{ inputs.image_name }}.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: seccomp-profile-${{ inputs.image_name }}
        path: seccomp-profile-${{ inputs.image_name }}.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: syscalls
        path: syscalls.txt
      
      
