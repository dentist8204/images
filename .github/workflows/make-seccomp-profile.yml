name: Make Seccomp Profile

on:
  workflow_dispatch:
    inputs:
      image_name:
        required: true
        type: choice
        options: ["age", "antlr", "latex"]
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        
env:
  REGISTRY: ghcr.io
  USERNAME: temp-user
  UID: 1008

jobs:
  make-seccomp-profile:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Packages
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends auditd bpftrace crun podman python3
    - name: Setup Temporary User
      run: |
        set -euo pipefail
        echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts
        sudo groupadd --gid ${{ env.UID }} ${{ env.USERNAME }}
        sudo useradd --uid ${{ env.UID }} --gid ${{ env.UID }} --create-home --shell /bin/bash ${{ env.USERNAME }}
        echo "${{ env.USERNAME }}:157257050:65536" | sudo tee -a /etc/subuid
        echo "${{ env.USERNAME }}:157257050:65536" | sudo tee -a /etc/subgid
        sudo cp -r environments /home/${{ env.USERNAME }}
        sudo chown -R ${{ env.USERNAME }}:${{ env.USERNAME }} /home/${{ env.USERNAME }}/environments
        sudo cp -r config /home/${{ env.USERNAME }}
        sudo chown -R ${{ env.USERNAME }}:${{ env.USERNAME }} /home/${{ env.USERNAME }}/config
        sudo loginctl enable-linger temp-user
    - name: Run Scripts
      run: |
        set -euo pipefail
        python3 scripts/run-seccomp-tests.py ${{ inputs.image_name }} ${{ env.REGISTRY }}/${{ github.repository }} ${{ env.USERNAME }} /run/user/${{ env.UID }}
        python3 scripts/format-seccomp-profile.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: seccomp-${{ inputs.image_name }}
        path: |
          syscalls.txt
          seccomp-profile.json
      
      
