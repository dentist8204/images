name: Make Seccomp Profile

on:
  workflow_dispatch:
    inputs:
      image_name:
        required: true
        type: choice
        options: ["age", "antlr", "base", "latex"]
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

jobs:
  make-seccomp-profile:
    runs-on: ubuntu-latest
    steps:
    - run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends auditd bpftrace
    - run: |
        sudo bpftrace -e '
            tracepoint:syscalls:sys_enter_execve 
            /str(args->filename) == "runc" || str(args->filename) == "/usr/bin/runc" || str(args->filename) == "/usr/local/bin/runc"/ 
            { 
              @runtime_tree[pid] = 1; 
            } 

            tracepoint:sched:sched_process_fork 
            /@runtime_tree[pid]/ 
            { 
              @runtime_tree[args->child_pid] = 1; 
            } 
            
            tracepoint:syscalls:sys_enter_seccomp
            /@runtime_tree[pid]/ 
            { 
              @pending[pid] = 1; 
            } 

            tracepoint:syscalls:sys_enter_execve 
            /@pending[pid]/ 
            { 
              @active[pid] = 1; 
            } 

            tracepoint:sched:sched_process_fork 
            /@active[pid]/ 
            { 
              @active[args->child_pid] = 1; 
            } 

            tracepoint:raw_syscalls:sys_enter 
            /@active[pid]/ 
            { 
              @current_id[pid] = args->id; 
            } 

            tracepoint:raw_syscalls:sys_exit 
            /@active[pid]/ 
            { 
              if (args->ret > -1) { 
                @[@current_id[pid]] = 1; 
              } 
              delete(@current_id[pid]); 
            }
          ' -o syscalls.txt &
        BPF_PID=$!
        sleep 5
        CONTAINER_ID=$(docker create ghcr.io/${{ github.repository }}/${{ inputs.image_name }}:latest uname -a)
        docker start $CONTAINER_ID
        timeout 20s docker wait $CONTAINER_ID
        sudo kill $BPF_PID
    - run: |
        echo '{"defaultAction":"SCMP_ACT_ERRNO","defaultErrno":"ENOSYS","architectures":["SCMP_ARCH_X86_64"],"syscalls":[{"action":"SCMP_ACT_ALLOW","names":[' > seccomp-profile.json
        sed -nE 's/.*@\[([0-9]+)\].*/\1/p' syscalls.txt | xargs -I {} sh -c "ausyscall {}" | sed 's/^/"/;s/$/",/' | sed '$ s/,$//' >> seccomp-profile.json
        echo ']}]}' >> seccomp-profile.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: seccomp-data-${{ inputs.image_name }}
        path: |
          seccomp-profile.json
          syscalls.txt
      
      
