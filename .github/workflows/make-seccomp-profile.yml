name: Make Seccomp Profile

on:
  workflow_dispatch:
    inputs:
      image_name:
        required: true
        type: choice
        options: ["age", "antlr", "base", "latex"]
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

jobs:
  list-syscalls:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends bpftrace
    - run: |
        sudo bpftrace -e '
          kprobe:audit_log_start /arg2 == 1326/ { 
            $ctx = (struct audit_context *)arg0;

            printf("ptr: %p | major: %d | ret: %d\n", $ctx, $ctx->major, $ctx->return_code);
            
            if ($ctx->return_code == 0) {
              @[$ctx->major] = 1; 
            }
          }
        ' -o syscalls.txt &
        
        BPF_PID=$!
        sleep 5
        CONTAINER_ID=$(docker create --security-opt=seccomp=config/default-docker-log-seccomp.json ghcr.io/${{ github.repository }}/${{ inputs.image_name }}:latest uname -a)
        docker start $CONTAINER_ID
        timeout 20s docker wait $CONTAINER_ID
        sudo kill $BPF_PID
    - run: |
        cat <<EOF > seccomp-profile.json
        {
          "defaultAction": "SCMP_ACT_ERRNO",
          "defaultErrno":"ENOSYS",
          "architectures": [
            "SCMP_ARCH_X86_64"
          ],
          "syscalls": [
            {
              "action": "SCMP_ACT_ALLOW",
              "names": [
        EOF
        
        sed -nE 's/.*@\[([0-9]+)\].*/\1/p' syscalls.txt | xargs -I {} sh -c "ausyscall {}" | sort |
        sed 's/^/        "/;s/$/",/' |  sed '$ s/,$//' >> seccomp-profile.json
        
        cat <<EOF >> seccomp-profile.json
              ]
            }
          ]
        }
        EOF
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: seccomp-${{ inputs.image_name }}
        path: |
          syscalls.txt
          seccomp-profile.json
      
      
