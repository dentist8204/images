name: Check PR

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/build-*.yml'
      - 'config/seccomp/**'
      - 'contexts/**'
      - 'environments/**'
      - 'scripts/seccomp/**'

concurrency:
  group: check-pr-${{ github.event_name }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-all:
    permissions:
      actions: write
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-all.yml
    with:
      push: false

  finish:
    runs-on: ubuntu-26.04
    needs: build-all
    steps:
      - run: true
    
