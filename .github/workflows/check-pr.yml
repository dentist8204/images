name: Check Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches:
     - main
    types:
     - opened
     - reopened
     - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-paths:
    runs-on: ubuntu-26.04
    outputs:
      build: ${{ steps.filter.outputs.build }}
      audit: ${{ steps.filter.outputs.audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
        filters: |
          build:
            - .github/workflows/build/**
            - 'contexts/**'
          audit:
            - .github/workflows/audit/**
            - 'config/seccomp/**'
            - 'environments/**'
            - 'scripts/seccomp/**'
  base:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-and-push.yml
    with:
      image_name: "base"
  derivatives:
    needs: base
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image_name:
          - "age"
          - "latex"
    uses: ./.github/workflows/build-and-push.yml
    with:
      image_name: ${{ matrix.image_name }}
  antlr:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-and-push.yml
    with:
      image_name: "antlr"
  make-seccomp-profiles:
    needs:
     - antlr
     - derivatives
    permissions:
      actions: write
    strategy:
      matrix:
        image_name:
          - "age"
          - "antlr"
          - "latex"
    uses: ./.github/workflows/make-seccomp-profile.yml
    with:
      image_name: ${{ matrix.image_name }}
  finish:
    runs-on: ubuntu-latest
    needs:
     - make-seccomp-profiles
    steps:
      - run: true
    
