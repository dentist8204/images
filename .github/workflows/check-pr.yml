name: Check PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: check-pr-${{ github.event_name }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-all:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-all.yml
    with:
      push: false

  finish:
    runs-on: ubuntu-26.04
    needs: build-all
    steps:
      - run: true
    
