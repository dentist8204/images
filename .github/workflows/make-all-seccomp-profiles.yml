name: Make All Seccomp Profiles

on:
  workflow_dispatch:
    inputs:
      upload:
        type: boolean
        default: false
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: false

concurrency:
  group: make-all-seccomp-profiles-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  make-seccomp-profiles:
    permissions:
      actions: write
    strategy:
      matrix:
        image_name:
          - "age"
          - "antlr"
          - "latex"
    uses: ./.github/workflows/make-seccomp-profile.yml
    with:
      image_name: ${{ matrix.image_name }}
      upload: ${{ inputs.upload }}

